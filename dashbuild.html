<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DashBuild — AI Dashboard Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--surface:#111;--surface2:#1a1a1a;--border:#222;
  --green:#00ff88;--green2:#00cc66;--red:#ff4466;--yellow:#ffcc00;
  --text:#f0f0f0;--muted:#666;--muted2:#444;
  --radius:10px;--font:'Syne',sans-serif;--mono:'JetBrains Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden}

/* TOPBAR */
#topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100}
#topbar .logo{font-size:18px;font-weight:800;color:var(--green);letter-spacing:-0.5px}
#topbar .logo span{color:var(--text)}
#topbar .actions{display:flex;gap:8px;align-items:center}
.btn{font-family:var(--font);font-weight:600;font-size:12px;padding:8px 16px;border-radius:6px;border:none;cursor:pointer;transition:all .15s;letter-spacing:.5px;text-transform:uppercase}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-outline:hover{border-color:var(--green);color:var(--green)}
.btn-green{background:var(--green);color:#000}
.btn-green:hover{background:var(--green2)}
.btn-red{background:var(--red);color:#fff}
.btn-sm{padding:6px 12px;font-size:11px}

/* KEY BANNER */
#key-banner{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;font-size:13px}
#key-banner.hidden{display:none}
#key-banner input{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;font-family:var(--mono);font-size:12px;outline:none}
#key-banner input:focus{border-color:var(--green)}
#key-status-dot{width:8px;height:8px;border-radius:50%;background:var(--muted2);flex-shrink:0}
#key-status-dot.ok{background:var(--green)}
#key-status-dot.err{background:var(--red)}
#key-label{color:var(--muted);font-size:12px;font-family:var(--mono);white-space:nowrap}

/* MAIN LAYOUT */
#app{display:flex;height:calc(100vh - 100px)}

/* SIDEBAR */
#sidebar{width:260px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface)}
#mode-toggle{display:flex;margin:12px;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
#mode-toggle button{flex:1;padding:8px;font-family:var(--font);font-size:11px;font-weight:700;border:none;cursor:pointer;letter-spacing:.5px;text-transform:uppercase;transition:all .15s}
#mode-toggle .active{background:var(--green);color:#000}
#mode-toggle .inactive{background:transparent;color:var(--muted)}
#sidebar-content{flex:1;overflow-y:auto;padding:0 12px 12px}
.sidebar-section{margin-bottom:20px}
.sidebar-label{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;padding:0 4px}
.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-family:var(--mono)}
.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-family:var(--font);font-size:12px;outline:none;transition:border .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--green)}
.form-group select option{background:var(--surface2)}
.form-group textarea{resize:vertical;min-height:70px}
.chip-group{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .15s;background:transparent}
.chip.active{border-color:var(--green);color:var(--green);background:rgba(0,255,136,.08)}
#build-btn{width:100%;margin-top:8px;padding:12px;font-size:13px;border-radius:8px}

/* VOICE MODE */
#voice-mode{padding:12px}
#voice-chat{height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px;padding:4px}
.vmsg{padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.5;max-width:95%}
.vmsg.ai{background:var(--surface2);color:var(--text);align-self:flex-start;border:1px solid var(--border)}
.vmsg.user{background:rgba(0,255,136,.12);color:var(--green);align-self:flex-end;border:1px solid rgba(0,255,136,.2)}
#voice-input-row{display:flex;gap:6px}
#voice-input{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-family:var(--font);font-size:12px;outline:none}
#voice-input:focus{border-color:var(--green)}
#mic-btn{width:36px;height:36px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
#mic-btn.listening{border-color:var(--red);color:var(--red);animation:pulse 1s infinite}
#voice-build-btn{width:100%;margin-top:8px;padding:10px;font-size:12px;border-radius:8px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* MAIN AREA */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#preview-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#preview-title{font-size:13px;font-weight:700;color:var(--muted)}
#preview-actions{display:flex;gap:6px}
#preview-frame-wrap{flex:1;overflow:hidden;position:relative}
#preview-frame{width:100%;height:100%;border:none;background:#fff}
#empty-state{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted)}
#empty-state.hidden{display:none}
#empty-state .big-icon{font-size:48px;opacity:.3}
#empty-state p{font-size:13px;text-align:center;max-width:240px;line-height:1.6}
#empty-state code{font-family:var(--mono);color:var(--green);font-size:11px}

/* GENERATING OVERLAY */
#gen-overlay{position:absolute;inset:0;background:rgba(10,10,10,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:10}
#gen-overlay.hidden{display:none}
#gen-log{font-family:var(--mono);font-size:11px;color:var(--green);max-width:400px;width:90%;height:120px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px}
.gen-spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#gen-status{font-size:13px;font-weight:700;color:var(--text)}

/* HISTORY PANEL */
#history-panel{width:220px;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;transition:width .2s}
#history-panel.collapsed{width:0;overflow:hidden}
#history-header{padding:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#history-header span{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
#history-list{flex:1;overflow-y:auto;padding:8px}
.history-item{padding:8px 10px;border-radius:6px;cursor:pointer;margin-bottom:4px;border:1px solid transparent;transition:all .15s}
.history-item:hover{background:var(--surface2);border-color:var(--border)}
.history-item.active{background:rgba(0,255,136,.08);border-color:rgba(0,255,136,.2)}
.history-item .hi-name{font-size:12px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-item .hi-type{font-size:10px;color:var(--muted);font-family:var(--mono)}
.history-item .hi-del{float:right;color:var(--muted);font-size:14px;opacity:0;transition:opacity .15s}
.history-item:hover .hi-del{opacity:1}

/* MOBILE */
@media(max-width:680px){
  #sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border);height:auto;max-height:55vh}
  #app{flex-direction:column}
  #history-panel{display:none}
  #main{min-height:45vh}
}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--muted2);border-radius:2px}
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">Dash<span>Build</span></div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="toggleHistory()">📋 History</button>
    <button class="btn btn-outline btn-sm" id="key-toggle-btn" onclick="toggleKeyBanner()">🔑 API Key</button>
    <button class="btn btn-outline btn-sm" id="export-btn" onclick="exportDash()" style="display:none">⬇ Export</button>
  </div>
</div>

<div id="key-banner">
  <div id="key-status-dot"></div>
  <span id="key-label">GROQ API KEY</span>
  <input type="password" id="api-key-input" placeholder="gsk_..." oninput="onKeyInput()" />
  <button class="btn btn-green btn-sm" onclick="saveKey()">Save</button>
  <a href="https://console.groq.com/keys" target="_blank" style="font-size:11px;color:var(--green);text-decoration:none;white-space:nowrap">Get free key →</a>
</div>

<div id="app">
  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="mode-toggle">
      <button class="active" id="form-tab" onclick="setMode('form')">📋 Form</button>
      <button class="inactive" id="voice-tab" onclick="setMode('voice')">🎤 Voice</button>
    </div>

    <!-- FORM MODE -->
    <div id="form-mode" id="sidebar-content">
      <div style="padding:0 4px">
        <div class="sidebar-section">
          <div class="sidebar-label">Dashboard Type</div>
          <div class="chip-group" id="type-chips">
            <div class="chip active" onclick="selectType(this,'Business')">Business</div>
            <div class="chip" onclick="selectType(this,'Fitness')">Fitness</div>
            <div class="chip" onclick="selectType(this,'ADHD')">ADHD</div>
            <div class="chip" onclick="selectType(this,'Content Creator')">Content</div>
            <div class="chip" onclick="selectType(this,'Finance')">Finance</div>
            <div class="chip" onclick="selectType(this,'Project')">Project</div>
            <div class="chip" onclick="selectType(this,'Student')">Student</div>
            <div class="chip" onclick="selectType(this,'Custom')">Custom</div>
          </div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-label">Details</div>
          <div class="form-group">
            <label>Dashboard Name</label>
            <input type="text" id="dash-name" placeholder="My Command Center" />
          </div>
          <div class="form-group">
            <label>Primary Goal</label>
            <input type="text" id="dash-goal" placeholder="Track sales & tasks daily" />
          </div>
          <div class="form-group">
            <label>Key Metrics to Track</label>
            <input type="text" id="dash-metrics" placeholder="Revenue, tasks, leads..." />
          </div>
          <div class="form-group">
            <label>Color Theme</label>
            <select id="dash-theme">
              <option value="dark green">Dark + Green (default)</option>
              <option value="dark purple">Dark + Purple</option>
              <option value="dark orange">Dark + Orange</option>
              <option value="light minimal">Light Minimal</option>
              <option value="neon cyberpunk">Neon Cyberpunk</option>
            </select>
          </div>
          <div class="form-group">
            <label>Extra Requirements</label>
            <textarea id="dash-extra" placeholder="Any special sections, integrations, or features..."></textarea>
          </div>
        </div>

        <button class="btn btn-green build-btn" id="build-btn" onclick="buildDashboard()">⚡ BUILD DASHBOARD</button>
      </div>
    </div>

    <!-- VOICE MODE -->
    <div id="voice-mode" style="display:none">
      <div id="voice-chat"></div>
      <div id="voice-input-row">
        <input type="text" id="voice-input" placeholder="Type or speak..." onkeydown="if(event.key==='Enter')sendVoice()" />
        <button id="mic-btn" onclick="toggleMic()" title="Voice input">🎤</button>
      </div>
      <button class="btn btn-green" id="voice-build-btn" onclick="buildFromVoice()" style="width:100%;margin-top:8px;display:none">⚡ BUILD IT</button>
    </div>
  </div>

  <!-- MAIN PREVIEW -->
  <div id="main">
    <div id="preview-header">
      <span id="preview-title">Preview</span>
      <div id="preview-actions">
        <button class="btn btn-outline btn-sm" id="new-dash-btn" onclick="newDashboard()" style="display:none">+ New</button>
      </div>
    </div>
    <div id="preview-frame-wrap">
      <div id="empty-state">
        <div class="big-icon">⚡</div>
        <p>Configure your dashboard on the left, then click <code>BUILD DASHBOARD</code></p>
        <p style="font-size:11px;margin-top:4px">Or switch to Voice mode and describe what you need</p>
      </div>
      <div id="gen-overlay" class="hidden">
        <div class="gen-spinner"></div>
        <div id="gen-status">Generating dashboard...</div>
        <div id="gen-log"></div>
      </div>
      <iframe id="preview-frame" style="display:none"></iframe>
    </div>
  </div>

  <!-- HISTORY PANEL -->
  <div id="history-panel" class="collapsed">
    <div id="history-header">
      <span>History</span>
      <button class="btn btn-outline btn-sm" onclick="toggleHistory()">✕</button>
    </div>
    <div id="history-list"></div>
  </div>
</div>

<script>
// ─── STATE ───────────────────────────────────────────────
let apiKey = localStorage.getItem('db_groq_key') || '';
let selectedType = 'Business';
let voiceHistory = [];
let voiceReady = false;
let dashHistory = JSON.parse(localStorage.getItem('db_history') || '[]');
let currentDash = null;
let recognition = null;
let isListening = false;

// ─── INIT ─────────────────────────────────────────────────
(function init() {
  if (apiKey) {
    document.getElementById('api-key-input').value = apiKey;
    setKeyStatus('ok');
    document.getElementById('key-banner').classList.add('hidden');
  }
  renderHistory();
  startVoiceSession();
})();

// ─── KEY MANAGEMENT ──────────────────────────────────────
function toggleKeyBanner() {
  document.getElementById('key-banner').classList.toggle('hidden');
}
function onKeyInput() {
  setKeyStatus('neutral');
}
function saveKey() {
  const k = document.getElementById('api-key-input').value.trim();
  if (!k) return;
  apiKey = k;
  localStorage.setItem('db_groq_key', k);
  setKeyStatus('ok');
  document.getElementById('key-banner').classList.add('hidden');
}
function setKeyStatus(s) {
  const dot = document.getElementById('key-status-dot');
  dot.className = s === 'ok' ? 'ok' : s === 'err' ? 'err' : '';
}

// ─── MODE TOGGLE ─────────────────────────────────────────
function setMode(m) {
  document.getElementById('form-mode').style.display = m === 'form' ? 'block' : 'none';
  document.getElementById('voice-mode').style.display = m === 'voice' ? 'block' : 'none';
  document.getElementById('form-tab').className = m === 'form' ? 'active' : 'inactive';
  document.getElementById('voice-tab').className = m === 'voice' ? 'active' : 'inactive';
}

// ─── TYPE CHIPS ──────────────────────────────────────────
function selectType(el, type) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  selectedType = type;
}

// ─── GROQ API CALL ───────────────────────────────────────
async function callGroq(messages, onChunk) {
  if (!apiKey) {
    toggleKeyBanner();
    throw new Error('No API key');
  }
  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
    body: JSON.stringify({
      model: 'llama3-8b-8192',
      messages,
      max_tokens: 8000,
      stream: true
    })
  });
  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.error?.message || 'API error');
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let full = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    const chunk = decoder.decode(value);
    const lines = chunk.split('\n').filter(l => l.startsWith('data: ') && l !== 'data: [DONE]');
    for (const line of lines) {
      try {
        const data = JSON.parse(line.slice(6));
        const token = data.choices?.[0]?.delta?.content || '';
        full += token;
        if (onChunk) onChunk(token, full);
      } catch {}
    }
  }
  return full;
}

// ─── BUILD DASHBOARD (FORM MODE) ─────────────────────────
async function buildDashboard() {
  if (!apiKey) { toggleKeyBanner(); return; }
  const name = document.getElementById('dash-name').value || selectedType + ' Dashboard';
  const goal = document.getElementById('dash-goal').value || 'Track and manage key metrics';
  const metrics = document.getElementById('dash-metrics').value || 'Tasks, progress, goals';
  const theme = document.getElementById('dash-theme').value;
  const extra = document.getElementById('dash-extra').value;

  showGenerating(true);
  log('🧠 Sending requirements to AI...');

  const prompt = buildPrompt(name, selectedType, goal, metrics, theme, extra);

  try {
    let html = '';
    await callGroq([
      { role: 'system', content: SYSTEM_PROMPT },
      { role: 'user', content: prompt }
    ], (token, full) => {
      html = full;
      if (full.length % 200 < 5) log('⚡ ' + full.length + ' chars generated...');
    });

    html = extractHTML(html);
    if (!html) throw new Error('No HTML in response');

    log('✅ Dashboard generated! Rendering...');
    await delay(300);
    showDashboard(html, name, selectedType);
    saveToDashHistory(name, selectedType, html);
  } catch (e) {
    log('❌ Error: ' + e.message);
    await delay(1500);
    showGenerating(false);
  }
}

// ─── VOICE MODE ──────────────────────────────────────────
function startVoiceSession() {
  voiceHistory = [];
  voiceReady = false;
  document.getElementById('voice-build-btn').style.display = 'none';
  addVMsg('ai', "Hey! I'm your AI builder. Tell me what kind of dashboard you need and I'll ask a few quick questions, then build it for you. What are you trying to track or manage?");
}

async function sendVoice() {
  const input = document.getElementById('voice-input');
  const text = input.value.trim();
  if (!text || !apiKey) { if (!apiKey) toggleKeyBanner(); return; }
  input.value = '';
  addVMsg('user', text);
  voiceHistory.push({ role: 'user', content: text });

  const thinkingEl = addVMsg('ai', '...');

  try {
    const msgs = [
      { role: 'system', content: VOICE_SYSTEM },
      ...voiceHistory
    ];
    let reply = '';
    await callGroq(msgs, (token, full) => {
      reply = full;
      thinkingEl.textContent = full;
    });

    voiceHistory.push({ role: 'assistant', content: reply });

    if (reply.includes('[READY_TO_BUILD]')) {
      thinkingEl.textContent = reply.replace('[READY_TO_BUILD]', '').trim();
      voiceReady = true;
      document.getElementById('voice-build-btn').style.display = 'block';
    }
  } catch (e) {
    thinkingEl.textContent = 'Error: ' + e.message;
  }
}

async function buildFromVoice() {
  if (!voiceReady) return;
  showGenerating(true);
  log('🧠 Extracting requirements from conversation...');

  try {
    const extractMsgs = [
      { role: 'system', content: SYSTEM_PROMPT },
      { role: 'user', content: 'Based on this conversation, build the dashboard now:\n\n' + voiceHistory.map(m => m.role + ': ' + m.content).join('\n') }
    ];
    let html = '';
    await callGroq(extractMsgs, (token, full) => {
      html = full;
      if (full.length % 200 < 5) log('⚡ ' + full.length + ' chars generated...');
    });

    html = extractHTML(html);
    if (!html) throw new Error('No HTML generated');
    log('✅ Done! Rendering...');
    await delay(300);
    showDashboard(html, 'Voice Dashboard', 'Custom');
    saveToDashHistory('Voice Dashboard', 'Custom', html);
  } catch (e) {
    log('❌ ' + e.message);
    await delay(1500);
    showGenerating(false);
  }
}

function addVMsg(role, text) {
  const el = document.createElement('div');
  el.className = 'vmsg ' + role;
  el.textContent = text;
  const chat = document.getElementById('voice-chat');
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

// ─── MIC ─────────────────────────────────────────────────
function toggleMic() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    alert('Speech recognition not supported in this browser. Try Chrome.');
    return;
  }
  if (isListening) {
    recognition?.stop();
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onstart = () => {
    isListening = true;
    document.getElementById('mic-btn').classList.add('listening');
  };
  recognition.onresult = e => {
    document.getElementById('voice-input').value = e.results[0][0].transcript;
    sendVoice();
  };
  recognition.onend = () => {
    isListening = false;
    document.getElementById('mic-btn').classList.remove('listening');
  };
  recognition.start();
}

// ─── UI HELPERS ──────────────────────────────────────────
function showGenerating(on) {
  document.getElementById('gen-overlay').classList.toggle('hidden', !on);
  document.getElementById('empty-state').classList.toggle('hidden', on);
  if (on) document.getElementById('gen-log').textContent = '';
}
function log(msg) {
  const el = document.getElementById('gen-log');
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

function showDashboard(html, name, type) {
  showGenerating(false);
  const frame = document.getElementById('preview-frame');
  frame.style.display = 'block';
  document.getElementById('empty-state').classList.add('hidden');
  frame.srcdoc = html;
  document.getElementById('preview-title').textContent = name;
  document.getElementById('export-btn').style.display = 'inline-block';
  document.getElementById('new-dash-btn').style.display = 'inline-block';
  currentDash = { html, name, type };
}

function newDashboard() {
  document.getElementById('preview-frame').style.display = 'none';
  document.getElementById('preview-frame').srcdoc = '';
  document.getElementById('empty-state').classList.remove('hidden');
  document.getElementById('export-btn').style.display = 'none';
  document.getElementById('new-dash-btn').style.display = 'none';
  document.getElementById('preview-title').textContent = 'Preview';
  currentDash = null;
  startVoiceSession();
}

function exportDash() {
  if (!currentDash) return;
  const blob = new Blob([currentDash.html], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = currentDash.name.replace(/\s+/g, '-').toLowerCase() + '.html';
  a.click();
}

// ─── HISTORY ─────────────────────────────────────────────
function toggleHistory() {
  document.getElementById('history-panel').classList.toggle('collapsed');
}
function saveToDashHistory(name, type, html) {
  const item = { id: Date.now(), name, type, html, date: new Date().toLocaleDateString() };
  dashHistory.unshift(item);
  if (dashHistory.length > 20) dashHistory.pop();
  localStorage.setItem('db_history', JSON.stringify(dashHistory));
  renderHistory();
}
function renderHistory() {
  const list = document.getElementById('history-list');
  list.innerHTML = '';
  if (!dashHistory.length) {
    list.innerHTML = '<div style="font-size:11px;color:var(--muted);padding:8px 4px">No dashboards yet</div>';
    return;
  }
  dashHistory.forEach(item => {
    const el = document.createElement('div');
    el.className = 'history-item' + (currentDash?.name === item.name ? ' active' : '');
    el.innerHTML = `
      <span class="hi-del" onclick="deleteDash(event,${item.id})">✕</span>
      <div class="hi-name">${item.name}</div>
      <div class="hi-type">${item.type} · ${item.date}</div>
    `;
    el.onclick = () => showDashboard(item.html, item.name, item.type);
    list.appendChild(el);
  });
}
function deleteDash(e, id) {
  e.stopPropagation();
  dashHistory = dashHistory.filter(d => d.id !== id);
  localStorage.setItem('db_history', JSON.stringify(dashHistory));
  renderHistory();
}

function extractHTML(raw) {
  const match = raw.match(/<!DOCTYPE html[\s\S]*<\/html>/i);
  if (match) return match[0];
  if (raw.includes('<html')) return raw.substring(raw.indexOf('<!DOCTYPE') > -1 ? raw.indexOf('<!DOCTYPE') : raw.indexOf('<html'));
  return raw.trim().startsWith('<') ? raw : null;
}
