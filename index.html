<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Dashboard Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--surface:#111;--surface2:#181818;--border:#222;--green:#00ff88;--green2:#00cc66;--red:#ff4455;--text:#f0f0f0;--muted:#555}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* TOP */
#top{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{font-size:20px;font-weight:800;color:var(--green)}
.logo span{color:var(--text)}
#key-row{display:flex;align-items:center;gap:8px}
#key-input{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:11px;width:200px;outline:none}
#key-input:focus{border-color:var(--green)}
#key-input::placeholder{color:var(--muted)}
#key-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
#key-dot.ok{background:var(--green)}
#key-dot.err{background:var(--red)}
.btn{font-family:'Syne',sans-serif;font-weight:700;font-size:11px;padding:7px 14px;border-radius:6px;border:none;cursor:pointer;letter-spacing:.5px;text-transform:uppercase;transition:all .15s}
.btn-green{background:var(--green);color:#000}
.btn-green:hover{background:var(--green2)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-ghost:hover{border-color:var(--green);color:var(--green)}

/* CHAT AREA */
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px;max-width:100%;animation:fadein .2s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.ai{align-self:flex-start}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.avatar{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-top:2px}
.msg.ai .avatar{background:var(--surface2);border:1px solid var(--border)}
.msg.user .avatar{background:rgba(0,255,136,.15);border:1px solid rgba(0,255,136,.2)}
.bubble{padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.65;max-width:80%}
.msg.ai .bubble{background:var(--surface);border:1px solid var(--border);color:var(--text)}
.msg.user .bubble{background:rgba(0,255,136,.1);border:1px solid rgba(0,255,136,.2);color:var(--green)}
.typing span{display:inline-block;width:6px;height:6px;background:var(--muted);border-radius:50%;margin:0 2px;animation:bounce .8s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}

/* BUILD BUTTON (shown by AI when ready) */
.build-trigger{margin-top:8px}
.build-trigger button{background:var(--green);color:#000;border:none;padding:10px 20px;border-radius:8px;font-family:'Syne',sans-serif;font-weight:800;font-size:13px;cursor:pointer;letter-spacing:.5px;transition:all .15s}
.build-trigger button:hover{background:var(--green2)}

/* ERROR */
.error-bubble{background:rgba(255,68,85,.1);border:1px solid rgba(255,68,85,.3);color:var(--red);padding:10px 14px;border-radius:10px;font-size:12px;font-family:'JetBrains Mono',monospace}

/* GENERATING */
#gen-bar{display:none;padding:12px 20px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
#gen-bar.show{display:flex;align-items:center;gap:10px}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
#gen-text{font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--green)}

/* INPUT ROW */
#input-row{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0;background:var(--bg)}
#msg-input{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:8px;font-family:'Syne',sans-serif;font-size:13px;outline:none;resize:none;height:44px;line-height:1.4;transition:border .15s}
#msg-input:focus{border-color:var(--green)}
#msg-input::placeholder{color:var(--muted)}
#send-btn{width:44px;height:44px;border-radius:8px;background:var(--green);border:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
#send-btn:hover{background:var(--green2)}
#mic-btn{width:44px;height:44px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
#mic-btn:hover{border-color:var(--green)}
#mic-btn.on{border-color:var(--red);color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* PREVIEW OVERLAY */
#preview{display:none;position:fixed;inset:0;z-index:200;flex-direction:column;background:var(--bg)}
#preview.show{display:flex}
#preview-bar{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--surface)}
#preview-title{font-size:13px;font-weight:700;color:var(--green)}
#preview-actions{display:flex;gap:6px}
#preview-frame{flex:1;border:none;background:#fff}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<div id="top">
  <div class="logo">Dash<span>Build</span></div>
  <div id="key-row">
    <div id="key-dot"></div>
    <input id="key-input" type="password" placeholder="gsk_ Groq key..." oninput="onKeyType()" onblur="saveKey()" />
    <a href="https://console.groq.com/keys" target="_blank" style="font-size:10px;color:var(--green);text-decoration:none;white-space:nowrap">Free key →</a>
  </div>
</div>

<div id="chat"></div>

<div id="gen-bar">
  <div class="spinner"></div>
  <div id="gen-text">Building your dashboard...</div>
</div>

<div id="input-row">
  <textarea id="msg-input" placeholder="Describe what you want to build..." onkeydown="handleKey(event)"></textarea>
  <button id="mic-btn" onclick="toggleMic()" title="Voice input">🎤</button>
  <button id="send-btn" onclick="send()">➤</button>
</div>

<!-- PREVIEW OVERLAY -->
<div id="preview">
  <div id="preview-bar">
    <span id="preview-title">Dashboard</span>
    <div id="preview-actions">
      <button class="btn btn-ghost" onclick="exportDash()">⬇ Export</button>
      <button class="btn btn-ghost" onclick="closePreview()">✕ Close</button>
    </div>
  </div>
  <iframe id="preview-frame"></iframe>
</div>

<script>
let apiKey = localStorage.getItem('db_key') || '';
let history = [];
let currentHTML = '';
let readyToBuild = false;
let recognition = null;
let isListening = false;

const SYSTEM = `You are a friendly AI dashboard builder. Your job is to chat with the user and figure out what dashboard they need. Ask short, simple questions one at a time — dashboard type, main goal, key things to track, color preference. After 3-4 messages when you have enough info, add [READY] at the very end of your message. Keep replies short and conversational. Never build the dashboard yourself in chat.`;

const BUILD_SYSTEM = `You are an expert frontend engineer. Output ONLY a complete single-file HTML dashboard app. No markdown, no backticks, no explanation. Start with <!DOCTYPE html> and end with </html>. Requirements: 5-6 tabs relevant to the use case, task manager with add/edit/delete/complete, progress tracking, localStorage persistence, mobile responsive, embedded floating AI chat (bottom right) that calls Groq API llama3-8b-8192 with real fetch calls and conversation history, settings panel for API key. Make it visually polished and dark-themed.`;

// INIT
(function(){
  if(apiKey){
    document.getElementById('key-input').value = apiKey;
    setDot('ok');
  }
  addMsg('ai', "Hey! Tell me what kind of dashboard you need — what are you trying to track or manage?");
})();

function onKeyType(){ setDot(''); }
function saveKey(){
  const k = document.getElementById('key-input').value.trim();
  if(!k) return;
  apiKey = k;
  localStorage.setItem('db_key', k);
  setDot('ok');
}
function setDot(s){
  const d = document.getElementById('key-dot');
  d.className = s === 'ok' ? 'ok' : s === 'err' ? 'err' : '';
}

function handleKey(e){
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
}

async function send(){
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if(!text) return;
  if(!apiKey){ alert('Paste your free Groq key in the top right first.\nGet one free at console.groq.com/keys'); return; }
  input.value = '';
  addMsg('user', text);
  history.push({role:'user', content:text});

  const thinking = addTyping();

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
      body:JSON.stringify({model:'llama3-8b-8192', messages:[{role:'system',content:SYSTEM},...history], max_tokens:400, stream:false})
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error?.message || 'API error '+res.status);
    let reply = data.choices[0].message.content;
    history.push({role:'assistant', content:reply});

    thinking.remove();

    if(reply.includes('[READY]')){
      reply = reply.replace('[READY]','').trim();
      readyToBuild = true;
      const el = addMsg('ai', reply);
      const btn = document.createElement('div');
      btn.className = 'build-trigger';
      btn.innerHTML = '<button onclick="buildDashboard()">⚡ Build My Dashboard</button>';
      el.querySelector('.bubble').appendChild(btn);
    } else {
      addMsg('ai', reply);
    }
  } catch(e){
    thinking.remove();
    addError(e.message);
    if(e.message.includes('401') || e.message.includes('invalid')) setDot('err');
  }
}

async function buildDashboard(){
  document.getElementById('gen-bar').classList.add('show');
  document.getElementById('gen-text').textContent = 'Building your dashboard...';

  const convo = history.map(m => m.role+': '+m.content).join('\n');
  const prompt = `Based on this conversation, build the complete dashboard now:\n\n${convo}\n\nOutput ONLY the full HTML file starting with <!DOCTYPE html>.`;

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
      body:JSON.stringify({model:'llama3-70b-8192', messages:[{role:'system',content:BUILD_SYSTEM},{role:'user',content:prompt}], max_tokens:8000, stream:false})
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error?.message || 'API error');
    let html = data.choices[0].message.content;

    // extract HTML
    const match = html.match(/<!DOCTYPE html[\s\S]*<\/html>/i);
    if(match) html = match[0];
    else if(!html.trim().startsWith('<')) throw new Error('AI response was incomplete. Please try again.');

    currentHTML = html;
    document.getElementById('gen-bar').classList.remove('show');
    showPreview(html);
    addMsg('ai', '✅ Done! Your dashboard is ready. Export it to save the file.');
  } catch(e){
    document.getElementById('gen-bar').classList.remove('show');
    addError(e.message);
  }
}

function showPreview(html){
  const frame = document.getElementById('preview-frame');
  frame.srcdoc = html;
  document.getElementById('preview').classList.add('show');
}
function closePreview(){
  document.getElementById('preview').classList.remove('show');
}
function exportDash(){
  if(!currentHTML) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([currentHTML],{type:'text/html'}));
  a.download = 'my-dashboard.html';
  a.click();
}

function addMsg(role, text){
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg '+role;
  div.innerHTML = `<div class="avatar">${role==='ai'?'⚡':'👤'}</div><div class="bubble">${text.replace(/\n/g,'<br>')}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}
function addTyping(){
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = `<div class="avatar">⚡</div><div class="bubble typing"><span></span><span></span><span></span></div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}
function addError(msg){
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = `<div class="avatar">⚡</div><div class="error-bubble">${msg}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// MIC
function toggleMic(){
  if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){alert('Use Chrome for voice input.');return;}
  if(isListening){recognition?.stop();return;}
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.onstart=()=>{isListening=true;document.getElementById('mic-btn').classList.add('on');}
  recognition.onresult=e=>{document.getElementById('msg-input').value=e.results[0][0].transcript;send();}
  recognition.onend=()=>{isListening=false;document.getElementById('mic-btn').classList.remove('on');}
  recognition.start();
}
</script>
</body>
</html>
